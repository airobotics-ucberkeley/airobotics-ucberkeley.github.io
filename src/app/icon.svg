<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="airobotics@berkeley">
  <!-- Berkeley blue ground, California gold airframe: the two site accents,
       drawn as a quadcopter so the mark still reads at 16px. -->
  <rect width="32" height="32" rx="7" fill="#003262"/>
  <g stroke="#fdb515" stroke-width="2.6" stroke-linecap="round">
    <path d="M9.5 9.5 22.5 22.5"/>
    <path d="M22.5 9.5 9.5 22.5"/>
  </g>
  <g fill="#fdb515">
    <circle cx="8.6" cy="8.6" r="3.1"/>
    <circle cx="23.4" cy="8.6" r="3.1"/>
    <circle cx="8.6" cy="23.4" r="3.1"/>
    <circle cx="23.4" cy="23.4" r="3.1"/>
  </g>
  <rect x="12.4" y="12.4" width="7.2" height="7.2" rx="1.9" fill="#4d9bff"/>
</svg>
